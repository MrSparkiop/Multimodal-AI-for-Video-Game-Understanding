[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesense"
version = "1.0.0"
description = "GameSense - Multimodal AI for Video Game Understanding (multi-label genre prediction from screenshots and descriptions)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Blagoy Hristov" }]
keywords = [
    "deep-learning",
    "multimodal",
    "multi-label-classification",
    "computer-vision",
    "nlp",
    "video-games",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40,<5",
    "huggingface_hub>=0.24",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "Pillow>=10.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.29", "nbformat>=5.9"]

[project.urls]
Repository = "https://github.com/"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that download pretrained weights or read the full dataset",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E203"]
